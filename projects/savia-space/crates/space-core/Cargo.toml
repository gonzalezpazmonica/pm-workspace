[package]
name = "space-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
space-contracts = { version = "0.1.0", path = "../space-contracts" }
space-store = { version = "0.1.0", path = "../space-store" }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
