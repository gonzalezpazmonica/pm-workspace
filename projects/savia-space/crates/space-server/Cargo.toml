[package]
name = "space-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "savia-space"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
space-contracts = { version = "0.1.0", path = "../space-contracts" }
space-core = { version = "0.1.0", path = "../space-core" }
space-store = { version = "0.1.0", path = "../space-store" }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
