id: agent.security-guardian
version: 1
description: "Audita cambios staged contra fugas de datos/credenciales antes de commit"
input:
  type: object
  properties: {}
safety:
  effect: mutation
  visibility: visible
  reversibility: reversible
  destructive: false
  external_side_effect: false
  human_gate: policy
  scope: [workspace]
execution:
  handler: "agent security-guardian"
laws:
  - LAW-PRIV-001
  - LAW-PRIV-002
enforcement:
    - block-credential-leak
    - block-pat-file-write
negative_tests:
    - guardrail-negative-tests
receipt:
  - savia-shield receipt
